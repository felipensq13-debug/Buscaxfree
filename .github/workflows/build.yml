
name: Build BuscaX Free

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o BuscaXFreeAndroid.zip -d extracted
          ls extracted/BuscaXFreeAndroid

      - name: Build APK
        working-directory: extracted/BuscaXFreeAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuscaXFree-APK
          path: extracted/BuscaXFreeAndroid/app/build/outputs/apk/debug/app-debug.apk

          
