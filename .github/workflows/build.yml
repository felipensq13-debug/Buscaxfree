name: Build BuscaX Free

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o BuscaXFreeAndroid.zip -d extracted
          ls extracted/BuscaXFreeAndroid

      - name: Build APK
        working-directory: extracted/BuscaXFreeAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BuscaXFree-APK
          path: extracted/BuscaXFreeAndroid/app/build/outputs/apk/debug/app-debug.apk
          
